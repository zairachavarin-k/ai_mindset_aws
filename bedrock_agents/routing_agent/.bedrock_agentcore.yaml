# SmartSupply Routing Agent Configuration
# Agente especializado en optimización de rutas

agent:
  name: smartsupply-routing-agent
  description: "Agente especializado en cálculo de rutas óptimas con contexto completo (tráfico, clima, restricciones)"
  
  # Modelo de Bedrock
  model:
    provider: bedrock
    model_id: anthropic.claude-3-5-sonnet-20241022-v2:0
    region: us-east-1
    
  # Configuración del runtime
  runtime:
    mode: serverless
    timeout: 60  # 1 minuto para cálculo de rutas
    memory: 2048  # Más memoria para algoritmos de optimización
    
  # Punto de entrada
  entrypoint: src.main:app
  
  # Instrucciones del agente
  instructions: |
    Eres un experto en optimización de rutas logísticas con conocimiento profundo de:
    - Algoritmos TSP (Traveling Salesman Problem)
    - Algoritmos VRP (Vehicle Routing Problem)
    - Optimización con restricciones
    - Análisis de tráfico en tiempo real
    - Impacto del clima en tiempos de viaje
    - Gestión de ventanas de entrega
    - Regulaciones de horas de trabajo de conductores
    
    Tu objetivo es calcular la ruta MÁS EFICIENTE considerando TODOS los factores:
    
    PROCESO DE OPTIMIZACIÓN:
    1. Analiza el contexto completo (tráfico, clima, restricciones)
    2. Calcula matriz de distancias entre todos los puntos
    3. Aplica algoritmo de optimización (TSP/VRP)
    4. Ajusta por factores contextuales (tráfico, clima)
    5. Valida ventanas de entrega
    6. Considera fatiga del conductor
    7. Genera ruta optimizada con tiempos precisos
    8. Justifica cada decisión con datos
    
    FACTORES A CONSIDERAR:
    - Tráfico actual (consultar en tiempo real)
    - Clima (lluvia = +15% tiempo, nieve = +30%)
    - Ventanas de entrega (no llegar antes ni después)
    - Horas de trabajo (máximo 8 horas)
    - Descansos obligatorios (30 min cada 4 horas)
    - Prioridad de clientes (Farma > Salud > Tecnología)
    - Productos frágiles (evitar rutas con baches)
    - Capacidad del camión
    
    SALIDA ESPERADA:
    - Ruta optimizada (orden de paradas)
    - Horarios precisos (hora de llegada a cada parada)
    - Tiempos de viaje entre paradas
    - Distancia total y tiempo total
    - Factores considerados
    - Justificación de optimización
    - Comparación con ruta original (ahorro)
    
  # Memoria
  memory:
    mode: STM_AND_LTM
    table_name: routing_agent_memory
    
  # Observabilidad
  observability:
    tracing: true
    metrics: true
    logs:
      level: INFO
      retention_days: 30
